
<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Título y descripción -->
  <title>{{ page.title | default: site_title_seo }}</title>

  <meta
    name="description"
    content="{{ page.description | default: site_description_seo }}"
  >

  <!-- Open Graph -->
  <meta property="og:title" content="{{ page.title | default: site_title_seo }}">
  <meta property="og:description" content="{{ page.description | default: site_description_seo }}">
  <meta property="og:image" content="{{ page.image | default: '/assets/img/social-preview.png' | relative_url | absolute_url }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:type" content="website">

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ page.title | default: site_title_seo }}">
  <meta name="twitter:description" content="{{ page.description | default: site_description_seo }}">
  <meta name="twitter:image" content="{{ page.image | default: '/assets/img/social-preview.png' | relative_url | absolute_url }}">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="{{ '/assets/img/favicons/favicon-96x96.png' | relative_url }}" sizes="96x96">
  <link rel="icon" type="image/svg+xml" href="{{ '/assets/img/favicons/favicon.svg' | relative_url }}">
  <link rel="shortcut icon" href="{{ '/assets/img/favicons/favicon.ico' | relative_url }}">
  <link rel="apple-touch-icon" sizes="180x180" href="{{ '/assets/img/favicons/apple-touch-icon.png' | relative_url }}">
  <meta name="apple-mobile-web-app-title" content="W4VZEN">
  <link rel="manifest" href="{{ '/assets/img/favicons/site.webmanifest' | relative_url }}">

  <!-- Conexiones anticipadas -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdnjs.cloudflare.com">

  <!-- Precarga de imagen provisional del HERO -->
  <link
    rel="preload"
    as="image"
    href="{{ '/assets/img/fondo-escritorio.webp' | relative_url }}"
    fetchpriority="high"
  >

  <!-- Google Fonts -->
  <link
    href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@300;400;700&family=Rubik+Glitch&family=Staatliches&display=swap"
    rel="stylesheet"
  >

  <!-- Font Awesome -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
  >

  <!-- CSS principal -->
  <link
    rel="stylesheet"
    href="{{ '/assets/css/estilos.css' | relative_url }}"
  >

</head>

<body>

  <!-- FONDO PARALLAX -->
  <div class="parallax-background"></div>
  <div class="parallax-overlay"></div>

  <!-- HEADER -->
  {% include header.html %}

  <!-- CONTENIDO -->
  {{ content }}

  <!-- FOOTER -->
  {% include footer.html %}

  <!-- JAVASCRIPT -->
  <script
    src="{{ '/assets/js/video.js' | relative_url }}"
    defer
  ></script>

</body>
</html>
